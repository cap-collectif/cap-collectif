Capco\AppBundle\Entity\Steps\SelectionStep:
    selectionStepBPAnalyse:
        id: selectionStepBPAnalyse
        title: Analyse
        label: Analyse
        body: Les projets déposés sont en cours d'analyse par les services concernés.
        startAt: <identity((new \DateTime('2024-02-01')))>
        endAt: <identity((new \DateTime('2031-12-31')))>
        voteType: 0
        defaultStatus: '@statusBPAnalysing'
    selectionStepBPVote:
        id: selectionStepBPVote
        title: Vote
        label: Vote
        body: Votez pour vos projets préférés du budget participatif.
        startAt: <identity((new \DateTime('2024-02-01')))>
        endAt: <identity((new \DateTime('2031-12-31')))>
        voteType: 2
        votesLimit: 3
        defaultStatus: '@statusBPVote'
    qaSelectionStepPetitionReview:
        id: qaSelectionStepPetitionReview
        title: Examen des pétitions
        label: Examen
        body: Étape sans vote, les pétitions archivées y portent l'étiquette « Archivée ».
        startAt: <identity((new \DateTime('2026-01-01 12:00:00')))>
        timeless: true
        isEnabled: true
        voteType: 0
    qaSelectionStepPetitionSecretBallot:
        id: qaSelectionStepPetitionSecretBallot
        title: Signature des pétitions à scrutin secret
        label: Scrutin secret
        body: Étape à seuil et à scrutin secret, les résultats seront publiés en 2035.
        startAt: <identity((new \DateTime('2026-01-01 12:00:00')))>
        timeless: true
        isEnabled: true
        voteType: 1
        voteThreshold: 150000
        secretBallot: true
        publishedVoteDate: <identity((new \DateTime('2035-01-01 12:00:00')))>
        actionButtonLabel: sign
        voteButtonIcon: pen

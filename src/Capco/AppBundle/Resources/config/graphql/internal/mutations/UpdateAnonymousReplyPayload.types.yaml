UpdateAnonymousReplyPayload:
    type: relay-mutation-payload
    config:
        description: 'Payload of UpdateAnonymousReply'
        fields:
            reply:
                type: 'InternalReply'
                resolve: '@=service("Capco\\AppBundle\\GraphQL\\Resolver\\Questionnaire\\QuestionnaireResultsAccessResolver").authorizeReply(value, context, info)'
                description: 'The updated AnonymousReply'
            errorCode:
                type: 'UpdateAnonymousReplyErrorCode'

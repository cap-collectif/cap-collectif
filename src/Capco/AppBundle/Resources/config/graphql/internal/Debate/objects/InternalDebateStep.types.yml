InternalDebateStep:
    type: object
    inherits:
        - InternalStep
        - Node
    config:
        name: DebateStep
        description: 'A step with a debate.'
        interfaces:
            - InternalStep
            - Node
        fields:
            kind:
                resolve: 'debate'
            id:
                description: 'The ID of an object.'
                builder: 'Relay::GlobalId'
                builderConfig:
                    typeName: DebateStep
            debate:
                description: 'The debate of the step.'
                type: 'InternalDebate!'
            contributors:
                type: 'InternalUserConnection!'
                description: 'A list of contributor associated with the step.'
                argsBuilder: 'Relay::ForwardConnection'
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Step\\StepContributorResolver", value, args)'
            participants:
                type: 'InternalAggregatedResult!'
                description: 'The participants count of the debate step.'
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Debate\\DebateStepContributorsResolver", value)'
            contributions:
                type: 'InternalAggregatedResult!'
                description: 'The contributions count of the debate step.'
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Debate\\DebateStepContributionsResolver", value)'
            votes:
                type: 'InternalAggregatedResult!'
                description: 'The votes count of the debate step.'
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Debate\\DebateStepVotesResolver", value)'
            debateType:
                description: 'the type of the debate'
                type: 'DebateType!'
            debateContent:
                description: 'the content of the debate'
                type: 'HTML'
            debateContentUsingJoditWysiwyg:
                description: 'Is the debateContent using Jodit Wysiwyg.'
                type: 'Boolean!'
            isAnonymousParticipationAllowed:
                description: 'Does the debate allow anonymous users to participate?'
                type: 'Boolean!'
            exportVotesUrls:
                type: '[StepExportUrl]'
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Step\\StepExportVotesUrlsResolver", value)'

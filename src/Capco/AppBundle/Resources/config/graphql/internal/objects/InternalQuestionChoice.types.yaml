InternalQuestionChoice:
    type: object
    inherits:
        - PreviewQuestionChoice
    config:
        name: QuestionChoice
        interfaces:
            - Node
        fields:
            id:
                builder: 'Relay::GlobalId'
                builderConfig:
                    typeName: QuestionChoice
            description:
                type: 'HTML'
            descriptionUsingJoditWysiwyg:
                type: 'Boolean!'
            color:
                type: 'Color'
                description: 'The color assign with the question'
            image:
                type: 'InternalMedia'
            responses:
                type: 'InternalResponseConnection!'
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\QuestionChoice\\QuestionChoiceResponseResolver", value, args, getUser())'
            ranking:
                type: '[InternalQuestionChoiceRanking]'
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\QuestionChoice\\QuestionChoiceRankingResolver", value, getUser())'
                description: 'Return the ranking of the given question choice'

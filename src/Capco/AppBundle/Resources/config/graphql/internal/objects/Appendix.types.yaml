Appendix:
    type: object
    config:
        description: 'A contribution'
        fields:
            body:
                type: 'HTML'
                description: 'Identifies the body of the contribution.'
            bodyUsingJoditWysiwyg:
                description: 'Is the body using Jodit Wysiwyg.'
                type: 'Boolean!'
            bodyText:
                type: 'String'
                description: 'Identifies the body of the contribution rendered to text.'
            appendixType:
                type: 'AppendixType!'
                resolve: '@=value.getAppendixType()'
            appendixTypeId:
                type: 'ID!'
                description: 'The id of the appendix type, as exposed by SectionAppendixType.id. Not named "id": Relay would merge the two types in its store.'
                resolve: '@=value.getAppendixType().getId()'

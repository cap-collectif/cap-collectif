InternalVocalContribution:
    type: object
    config:
        name: VocalContribution
        fieldsDefaultAccess: "@=hasRole('ROLE_ADMIN')"
        interfaces:
            - Node
        fields:
            id:
                type: 'ID!'
                access: '@=true'
                builder: 'Relay::GlobalId'
                builderConfig:
                    typeName: VocalContribution
            completionStatus:
                type: 'ContributionCompletionStatus!'
                description: 'The contribution status wether or not the participant/user has meet all requirements'
                access: '@=true'
            file:
                type: 'ID!'
                description: 'The protected Media global ID used by the BO.'
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\VocalContribution\\VocalContributionMediaIdResolver", value)'
            user:
                type: 'InternalUser'
            participant:
                type: 'InternalParticipant'
            createdAt:
                type: 'DateTime!'

InternalPage:
    type: object
    inherits:
        - NodeSlug
        - UniformResourceLocatable
    config:
        name: Page
        interfaces:
            - NodeSlug
            - UniformResourceLocatable
        description: 'A page.'
        fields:
            id:
                type: 'ID!'
                builder: 'Relay::GlobalId'
                builderConfig:
                    typeName: Page
            url:
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Page\\PageUrlResolver", value)'
            title:
                type: 'String'
                argsBuilder: 'Translatable::Field'
                resolve: '@=value.getTitle(args["locale"])'
            body:
                type: 'String'
                argsBuilder: 'Translatable::Field'
                resolve: '@=value.getBody(args["locale"])'
            translations:
                type: '[InternalPageTranslation!]!'
            media:
                type: 'InternalMedia'
                resolve: '@=value.getMedia()'
            cover:
                type: 'InternalMedia'
                resolve: '@=value.getCover()'
            metaDescription:
                type: 'String'
                argsBuilder: 'Translatable::Field'
                resolve: '@=value.getMetaDescription(args["locale"])'
            isEnabled:
                type: 'Boolean!'
                description: 'Whether the page is published.'
                resolve: '@=value.getIsEnabled()'
            customCode:
                type: 'String'
                resolve: '@=value.getCustomCode()'
            updatedAt:
                type: 'DateTime'
                description: 'The date of the last update of the page.'
                resolve: '@=value.getUpdatedAt()'
            menuItems:
                type: '[InternalMenuItem!]!'
                description: 'The menu items linking to the page.'
                access: "@=hasRole('ROLE_ADMIN')"
                resolve: '@=value.getMenuItems().toArray()'
            translationBySlug:
                type: 'InternalPageTranslation!'
                args:
                    slug: 'String!'
                resolve: '@=value.getTranslationBySlug(args["slug"])'

InternalMediaResponse:
    type: object
    inherits:
        - InternalResponse
    config:
        name: MediaResponse
        interfaces:
            - InternalResponse
        description: 'A response'
        fields:
            id:
                description: 'The ID of an object.'
                builder: 'Relay::GlobalId'
                builderConfig:
                    typeName: MediaResponse
            question:
                type: 'InternalQuestion!'
            medias:
                access: '@=service("Capco\\AppBundle\\GraphQL\\Resolver\\Questionnaire\\QuestionnaireResultsAccessResolver").canViewResponse(value, getUser(), context, info)'
                type: '[InternalMedia!]!'
                description: 'Medias'

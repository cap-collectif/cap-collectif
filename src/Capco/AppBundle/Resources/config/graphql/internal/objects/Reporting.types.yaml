Reporting:
    type: object
    inherits:
        - ContributionWithAuthor
        - Contribution
    config:
        description: 'A report'
        interfaces:
            - Contribution
            - ContributionWithAuthor
        fields:
            createdAt:
                type: 'DateTime!'
                description: 'Identifies the date and time when the object was created.'
            author:
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Reporting\\ReportingAuthorResolver", value)'
            bodyText:
                type: 'String!'
                description: 'The escaped content of the argument.'
            type:
                type: 'ReportingType!'
                description: 'Kind of report.'
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Reporting\\ReportingTypeResolver", value)'
            body:
                type: 'String!'
                description: 'The content of the argument.'
            kind:
                type: 'String!'
                resolve: 'report'
            url:
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Reporting\\ReportingUrlResolver", value)'
            isArchived:
                type: 'Boolean!'
                access: "@=hasRole('ROLE_ADMIN')"
                description: 'Whether the reporting has been processed by an administrator.'
                resolve: '@=value.getIsArchived()'

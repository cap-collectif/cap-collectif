PreviewMedia:
    type: object
    inherits:
        - UniformResourceLocatable
    config:
        name: Media
        fieldsDefaultAccess: '@=!hasFeatureFlag("private_media_read_enforcement") or service("Capco\\AppBundle\\Service\\MediaAccessResolver").canView(value, getUser(), context, info)'
        interfaces:
            - UniformResourceLocatable
        description: 'A file uploaded by a user.'
        fields:
            url:
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Media\\MediaUrlResolver", value, args, context)'

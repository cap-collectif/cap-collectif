PreviewMedia:
    type: object
    inherits:
        - UniformResourceLocatable
    config:
        name: Media
        # shortcut: expose media fields until the public/private usage model in #20499 is implemented.
        interfaces:
            - UniformResourceLocatable
        description: 'A file uploaded by a user.'
        fields:
            url:
                resolve: '@=query("Capco\\AppBundle\\GraphQL\\Resolver\\Media\\MediaUrlResolver", value, args, context)'

imports:
    - { resource: ../services.yaml }

translation:
    symfony_profiler:
        enabled: false

# We disable translation except for routes
parameters:
    # Allow Google ReCaptcha to work in test mode
    # see https://developers.google.com/recaptcha/docs/faq#id-like-to-run-automated-tests-with-recaptcha.-what-should-i-do
    env(SYMFONY_RECAPTCHA_PRIVATE_KEY): 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe

monolog:
    handlers:
        main:
            type: stream
            path: php://stderr
            level: warning
        file:
            type: stream
            path: '%kernel.logs_dir%/test.log'
            level: debug
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    # Keep SMS and CAS services replaceable before their consumers are instantiated.
    # Redefinitions must retain scalar arguments that cannot be autowired.
    Capco\AppBundle\Fetcher\SmsProviderFetcher:
        public: true
        arguments:
            $smsProvider: '%sms_provider%'

    # Separate preparation indexer: HTTP tests disable application indexation.
    test.identity_search_indexer:
        class: Capco\AppBundle\Elasticsearch\Indexer

    Capco\UserBundle\Handler\CasHandler:
        public: true
        arguments:
            $environment: '%kernel.environment%'

    # We disable captcha validation
    Capco\AppBundle\Validator\Constraints\CaptchaValidator:
        autowire: true
        arguments:
            $enabled: false
        tags:
            - { name: validator.constraint_validator, alias: captcha.validator }
    # We disable translation
    Capco\AppBundle\Translator\NoTranslator:
        decorates: translator
        arguments:
            - '@Capco\AppBundle\Translator\NoTranslator.inner'

    Capco\AppBundle\GraphQL\Mutation\ResetPasswordMutation:
        arguments:
            $firewallName: '%fos_user.firewall_name%'

    Capco\AppBundle\GraphQL\Mutation\Participant\VerifyParticipantPhoneNumberMutation:
        arguments:
            $firewallName: '%fos_user.firewall_name%'

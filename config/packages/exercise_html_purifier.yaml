exercise_html_purifier:
    default_cache_serializer_path: '%kernel.cache_dir%/htmlpurifier'
    html_profiles:
        user:
            config:
                HTML.SafeIframe: true
                Attr.AllowedFrameTargets: ['_blank']
                URI.SafeIframeRegexp: "#^(https?:)?//(www\\.youtube(?:-nocookie)?\\.com/embed/|player\\.vimeo\\.com/video/)#"
        admin:
            config:
                HTML.SafeIframe: true
                HTML.Trusted: true
                Attr.AllowedFrameTargets: ['_blank']
                Attr.EnableID: true
                URI.SafeIframeRegexp: "#^(https?:)?//([-\\w\\.]+)+(:\\d+)?(/([\\w/_\\.]*(\\?\\S+)?)?)?#"
                CSS.AllowTricky: true
                CSS.Trusted: true
            # Keep the markup required by Instagram and TikTok embed scripts.
            attributes:
                blockquote:
                    data-instgrm-permalink: URI
                    data-instgrm-version: Number
                    data-instgrm-captioned: Text
                    data-video-id: Text
                    data-embed-from: Text
            elements:
                section: ['Block', 'Flow', 'Common']

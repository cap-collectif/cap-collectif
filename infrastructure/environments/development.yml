services:
    application:
        links:
            - database:database
            - elasticsearch:elasticsearch
            - kibana:kibana
            - redis:redis
            - mailcatcher:mailcatchersmtp
            - nextjs
        environment:
            DOCKER_GID: 100
            SYMFONY_INSTANCE_NAME: dev
            SYMFONY_REDIS_PREFIX: dev
            PHP_XDEBUG_ENABLED: 0
        hostname: capco.dev
        volumes:
            - ../../:/var/www
            - ../../public/media:/var/www/public/media
            - ../../public/export:/var/www/public/export
            - /tmp:/tmp
            - /var/run/docker.sock:/var/run/docker.sock
            - /usr/local/bin/docker:/usr/bin/docker
            - /etc/localtime:/etc/localtime:ro
            - php_sf_cache:/var/www/var/cache

    # These images run under emulation on ARM hosts.
    mailcatcher:
        platform: linux/amd64

    kibana:
        platform: linux/amd64

    nextjs:
        container_name: capco_nextjs_1
        image: 'node:20.19'
        user: 'node'
        working_dir: /var/www/admin-next
        links:
            - redis:redis
        environment:
            - NODE_ENV=development
            - SYMFONY_ENV=dev
            - SYMFONY_REDIS_HOST=redis
        volumes:
            - ../../:/var/www
        ports:
            - '3000:3000'
        command: ./run.sh

    database:
        ports:
            - '3306:3306'
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 'True'
            MYSQL_DATABASE: 'symfony'
        volumes:
            - /tmp:/tmp
            - database_data:/var/lib/mysql

    elasticsearch:
        build: ../services/elasticsearch
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        environment:
            - cluster.name=capco
            - bootstrap.memory_lock=true
            - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
        ulimits:
            memlock:
                soft: -1
                hard: -1
        # mem_limit: 1g
        ports:
            - '9200:9200'

volumes:
    database_data:
    elasticsearch_data:
    php_sf_cache:
